services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/mernstack
      CHOKIDAR_USEPOLLING: "true"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://server:5000
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev -- --host --port 5173
